name: wt_firepod_list_view
description: List component that directly binds firebase list.
version: 0.0.1
homepage: https://github.com/tmcmaster/wt_firepod_list_view
publish_to: none

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.29.2'

dependencies:
  cupertino_icons:
  firebase_auth:
  firebase_core:
  firebase_database:
  firebase_ui_database:
  flutter:
    sdk: flutter
  flutter_form_builder:
  flutter_riverpod:
  font_awesome_flutter:
  form_builder_validators:
  freezed:
  freezed_annotation:
  riverpod:
  uuid:
  wt_action_button:
    git: git@github.com:tmcmaster/wt_action_button.git
  wt_firepod:
    git: git@github.com:tmcmaster/wt_firepod.git
  wt_logging:
    git: git@github.com:tmcmaster/wt_logging.git
  wt_models:
    git: git@github.com:tmcmaster/wt_models.git

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

dependency_overrides:
  wt_firepod:
    path: ../wt_firepod
  wt_logging:
    path: ../wt_logging
  wt_settings:
    path: ../wt_settings

