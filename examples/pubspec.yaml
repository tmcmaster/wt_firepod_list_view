name: wt_firepod_list_view_examples
description: App to test the wt_firepod_list_view library.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"


dependencies:
  cupertino_icons:
  firebase_core:
  firebase_database:
  firebase_ui_database:
  flutter:
    sdk: flutter
  flutter_form_builder:
  flutter_lints:
  flutter_riverpod:
  font_awesome_flutter:
  form_builder_validators:
  freezed_annotation:
  riverpod:
  wt_action_button:
    git: git@github.com:tmcmaster/wt_action_button.git
  wt_firepod:
    git: git@github.com:tmcmaster/wt_firepod.git
  wt_firepod_list_view:
    path: ..
  wt_logging:
    git: git@github.com:tmcmaster/wt_logging.git
  wt_models:
    git: git@github.com:tmcmaster/wt_models.git

dev_dependencies:
  build_runner:
  flutter_test:
    sdk: flutter
  freezed:
  json_serializable:

flutter:
  uses-material-design: true

